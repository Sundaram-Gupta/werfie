<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Clone API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .topbar {
            display: none;
        }
        .swagger-ui .info {
            margin: 50px 0;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                // Use gateway-served spec so it works on LAN IP too
                url: "/api-docs/spec",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                showRequestHeaders: true,
                tryItOutEnabled: true,
                persistAuthorization: true,
                // Force requests to use the same host you opened docs from.
                // This prevents "localhost" from breaking auth/authorize on other devices.
                // Keep relative /api/... URLs relative. Converting them to absolute URLs can cause
                // Swagger UI's fetch layer to drop the Authorize header (401 "No token provided" on admin routes).
                requestInterceptor: (req) => {
                    try {
                        const origin = window.location.origin;
                        if (origin && typeof req?.url === 'string') {
                            let u = req.url.trim();
                            if (u.startsWith('//')) {
                                u = `${window.location.protocol}${u}`;
                            }
                            // Only rewrite loopback absolute URLs to the host you opened docs from (LAN-safe).
                            u = u.replace(/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?/i, origin);
                            // If Swagger produced a full URL for this same origin, shorten to path+search (preserves Bearer auth).
                            if (/^https?:\/\//i.test(u) && u.startsWith(origin)) {
                                try {
                                    const parsed = new URL(u);
                                    u = parsed.pathname + parsed.search;
                                } catch { /* keep u */ }
                            }
                            req.url = u;
                        }
                    } catch { /* ignore */ }
                    return req;
                }
            });
        };
    </script>
</body>
</html>
