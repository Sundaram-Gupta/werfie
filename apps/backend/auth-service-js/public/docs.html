<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Clone API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .topbar {
            display: none;
        }
        .swagger-ui .info {
            margin: 50px 0;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                // Use gateway-served spec so it works on LAN IP too
                url: "/api-docs/spec",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                showRequestHeaders: true,
                tryItOutEnabled: true,
                persistAuthorization: true,
                // Force requests to use the same host you opened docs from.
                // This prevents "localhost" from breaking auth/authorize on other devices.
                requestInterceptor: (req) => {
                    try {
                        const origin = window.location.origin;
                        if (origin && typeof req?.url === 'string') {
                            let u = req.url.trim();
                            // Fix protocol-relative URLs like //host/path
                            if (u.startsWith('//')) {
                                u = `${window.location.protocol}${u}`;
                            }
                            // Fix relative URLs so browser never treats them as invalid CORS targets
                            if (u.startsWith('/')) {
                                u = `${origin}${u}`;
                            } else if (!/^https?:\/\//i.test(u)) {
                                u = `${origin}/${u.replace(/^\/+/, '')}`;
                            }
                            // Force loopback URLs to current origin (LAN-safe + no cross-origin surprises)
                            u = u.replace(/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?/i, origin);
                            req.url = u;
                        }
                    } catch { /* ignore */ }
                    return req;
                }
            });
        };
    </script>
</body>
</html>
