openapi: 3.0.3
info:
  title: X-Clone API
  description: |
    A Twitter/X clone API built with microservices architecture.
    
    ## Architecture
    - **Auth Service**: User authentication and JWT management
    - **User Service**: Profile management and user data
    - **Content Service**: Posts, likes, retweets, and media
    - **API Gateway**: Nginx reverse proxy
    
    ## Authentication
    Most endpoints require a JWT Bearer token in the Authorization header.
    Obtain a token by registering or logging in.
    
  version: 1.0.0
  contact:
    name: API Support
    email: support@xclone.example.com

servers:
  - url: http://localhost:3001/api
    description: Local development server

tags:
  - name: Authentication
    description: User registration, login, and session management
  - name: Users
    description: User profile operations
  - name: Posts
    description: Post creation, retrieval, and interactions
  - name: Media
    description: Media upload and retrieval
  - name: Timeline
    description: Timeline and feed operations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login or registration

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        profile:
          $ref: '#/components/schemas/Profile'
        createdAt:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        handle:
          type: string
        bio:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        banner:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        content:
          type: string
        mediaUrls:
          type: string
          description: JSON stringified array of media URLs
          nullable: true
        replyToId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        _count:
          type: object
          properties:
            replies:
              type: integer
            likes:
              type: integer
            retweets:
              type: integer

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
                - handle
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                handle:
                  type: string
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user profile by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          posts:
                            type: integer
                          followers:
                            type: integer
                          following:
                            type: integer
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update user profile
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                bio:
                  type: string
                location:
                  type: string
                website:
                  type: string
                avatar:
                  type: string
                banner:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '403':
          description: Forbidden - can only update own profile

  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts (feed)
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by user ID
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'

    post:
      tags:
        - Posts
      summary: Create a new post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                mediaUrls:
                  type: array
                  items:
                    type: string
                replyToId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Get a single post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found

  /posts/{id}/like:
    post:
      tags:
        - Posts
      summary: Like a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post liked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  postId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time

    delete:
      tags:
        - Posts
      summary: Unlike a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post unliked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /posts/{id}/retweet:
    post:
      tags:
        - Posts
      summary: Retweet a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post retweeted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  postId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time

    delete:
      tags:
        - Posts
      summary: Unretweet a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post unretweeted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /posts/{id}/replies:
    get:
      tags:
        - Posts
      summary: Get replies to a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      tags:
        - Posts
      summary: Create reply to a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID to reply to
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Reply text (1–280 chars)
      responses:
        '200':
          description: Created reply
        '400':
          description: Content is required
        '401':
          description: Unauthorized
        '404':
          description: Post not found

  /media/upload:
    post:
      tags:
        - Media
      summary: Upload media file
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (max 5MB)
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: /api/media/uploads/1768376722983.jpg
        '400':
          description: No file uploaded or file too large

  /media/uploads/{filename}:
    get:
      tags:
        - Media
      summary: Get uploaded media file
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /timeline/home:
    get:
      tags:
        - Timeline
      summary: Get home timeline
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Timeline posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
