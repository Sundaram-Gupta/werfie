openapi: 3.0.3
info:
  title: Werfie API
  description: |
    Complete API documentation for Werfie (X-Clone) platform.
    - **Client Gateway**: http://localhost:3001
    - **Admin Backend**: http://localhost:3012
    - **Messaging Service**: http://localhost:3019 (direct or via gateway)

    ## Quick test (always 200)
    **GET /api/health** - No auth. Returns 200 when gateway is up.

    ## ⚠️ Fix "Unauthorized" on Messaging / protected endpoints
    1. Expand **POST /api/auth/login** and click **Try it out**
    2. Use `{"email":"demo1@example.com","password":"Werfie@123"}` (or your user)
    3. Click **Execute**, then copy the `accessToken` from `data.accessToken` in the response
    4. Click **Authorize** (lock icon 🔒 at top right), paste the token (no "Bearer " prefix), click **Authorize**
    5. Close the dialog. Now Messaging and other protected endpoints will return 200 instead of 401

    ## Proxied endpoints (Users, Posts, etc.)
    Endpoints like /api/users/*, /api/posts/* are proxied to microservices. Ensure those services are running (see ecosystem.config.js) or you may get 5xx.
  version: 1.0.0

servers:
  # IMPORTANT: keep the first server relative so Swagger works from LAN IPs too.
  # If you open `/api-docs` from another device, `localhost` points to *that device* and causes "Failed to fetch"/CORS-like errors.
  - url: /
    description: Current host (recommended)
  - url: http://localhost:3001
    description: Client Gateway (localhost)
  - url: http://127.0.0.1:3001
    description: Client Gateway (127.0.0.1)
  - url: http://localhost:3019
    description: Messaging Service (direct)
  - url: http://localhost:3012
    description: Admin Backend

tags:
  - name: Messaging
    description: |
      **401 Unauthorized?** Call POST /api/auth/login first, copy accessToken, then click **Authorize** (lock icon) and paste the token.
  - name: Ads
    description: |
      **All Ads endpoints require authentication.** If you get 401 Unauthorized:
      1. Call **POST /api/auth/login** and copy `data.accessToken`
      2. Click **Authorize** (lock icon), paste the token (no "Bearer " prefix), then **Authorize**
      3. Try the Ads request again.

components:
  responses:
    Unauthorized:
      description: Unauthorized - use Authorize with accessToken from POST /api/auth/login
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: boolean, example: false }
              message: { type: string, example: "Unauthorized" }
              data: { type: object, nullable: true }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the accessToken from /api/auth/login (no "Bearer " prefix)
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token

  security:
    - bearerAuth: []

paths:
  # ============ HEALTH ============
  /api/health:
    get:
      summary: Gateway health check
      description: Returns 200 when the gateway is running. No auth required.
      tags: [Health]
      security: []
      responses:
        '200': { description: Gateway is healthy }

  # ============ AUTH ============
  # STEP 1: Call POST /api/auth/login with email/password
  # STEP 2: Copy the accessToken from the response
  # STEP 3: Click the Authorize button (lock icon, top right) and paste ONLY the token (no "Bearer ")
  # STEP 4: Now GET /me, POST /logout, POST /change-password will return 200
  /api/auth/login:
    post:
      summary: Login
      description: Returns accessToken and refreshToken. Use accessToken in Authorize for /me and /change-password.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: user1@xclone.com
              password: password123
      responses:
        '200': { description: Login successful, returns token and user }
        '400': { description: Validation error }
        '401': { description: Invalid credentials }

  /api/auth/register:
    post:
      summary: Register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, handle]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                handle: { type: string }
            example:
              email: newuser@example.com
              password: password123
              name: New User
              handle: newuser
      responses:
        '201': { description: User created }
        '400': { description: Validation error or email/handle taken }
        '500': { description: Internal server error }

  /api/auth/me:
    get:
      summary: Get current user
      description: Requires Bearer token. Click Authorize and paste the accessToken from login.
      tags: [Auth]
      security: [bearerAuth: []]
      responses:
        '200': { description: Current user }
        '401': { description: Missing or invalid token }

  /api/auth/logout:
    post:
      summary: Logout
      description: Requires Bearer access token (same as /me). Invalidates all refresh tokens for the user.
      tags: [Auth]
      security: [bearerAuth: []]
      responses:
        '200': { description: Logged out }
        '401': { description: Missing or invalid token }

  /api/auth/refresh:
    post:
      summary: Refresh token
      description: Send refreshToken from login response in body. Returns new accessToken. No Bearer needed.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
            example:
              refreshToken: "<paste refreshToken from login response>"
      responses:
        '200': { description: New access token }
        '400': { description: Refresh token required }
        '401': { description: Invalid or expired refresh token }

  /api/auth/change-password:
    post:
      summary: Change password
      description: Requires Bearer access token. Click Authorize and paste accessToken from login.
      tags: [Auth]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
            example:
              currentPassword: password123
              newPassword: newpassword456
      responses:
        '200': { description: Password changed }
        '400': { description: Incorrect current password }
        '401': { description: Unauthorized }
        '404': { description: User not found }

  # ============ USERS ============
  /api/users/profile:
    get:
      summary: Get my profile
      description: Requires Bearer token. Use Authorize (lock icon) and paste the accessToken from POST /api/auth/login.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200': { description: User profile }
        '401': { description: Unauthorized - call Authorize and add your accessToken from login }

  /api/users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: User }
        '404': { description: User not found }
    put:
      summary: Update profile
      description: Requires Bearer token. Authorize with accessToken from login. Use your user id in path.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                bio: { type: string }
                avatarUrl: { type: string }
      responses:
        '200': { description: Updated }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/users/{id}/follow:
    post:
      summary: Follow user
      description: Requires Bearer token. Authorize with accessToken from login. Id = user to follow.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Following }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    delete:
      summary: Unfollow user
      description: Requires Bearer token. Authorize with accessToken from login. Id = user to unfollow.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Unfollowed }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/users/{id}/followers:
    get:
      summary: Get followers
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: List of followers }

  /api/users/{id}/following:
    get:
      summary: Get following
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: List of following }

  /api/users/search:
    get:
      summary: Search users
      tags: [Users]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: Search results }

  /api/users/suggestions:
    get:
      summary: Who to follow
      tags: [Users]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: Suggested users }

  # ============ POSTS ============
  # All post endpoints require Bearer token. Use Authorize with accessToken from POST /api/auth/login.
  /api/posts:
    get:
      summary: Get feed
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: List of posts }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    post:
      summary: Create post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string }
                media: { type: array, items: { type: string, format: binary } }
      responses:
        '201': { description: Post created }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/{id}:
    get:
      summary: Get single post
      tags: [Posts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Post }
    delete:
      summary: Delete post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/{id}/like:
    post:
      summary: Like post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Liked }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    delete:
      summary: Unlike post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Unliked }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/{id}/retweet:
    post:
      summary: Retweet
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Retweeted }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    delete:
      summary: Remove retweet
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/{id}/replies:
    get:
      summary: Get replies
      tags: [Posts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        '200': { description: List of replies }
    post:
      summary: Create reply
      description: Create a reply to a post. Request body must include content.
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID to reply to
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, description: Reply text (1–280 chars) }
      responses:
        '200': { description: Created reply }
        '400': { description: Content is required }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
        '404': { description: Post not found }

  /api/posts/{id}/bookmark:
    post:
      summary: Bookmark post
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Bookmarked }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    delete:
      summary: Remove bookmark
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/following:
    get:
      summary: Get following feed
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Feed }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/timeline/home:
    get:
      summary: Home timeline
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: Home timeline }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/posts/search:
    get:
      summary: Search posts
      tags: [Posts]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Search results }

  /api/posts/bookmarks:
    get:
      summary: Get bookmarks
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Bookmarked posts }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  # ============ TIMELINE & EXPLORE ============
  /api/timeline/home:
    get:
      summary: Home timeline
      description: Requires Bearer token. Use **Authorize** and paste your accessToken from POST /api/auth/login.
      tags: [Timeline]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: Home timeline }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/trends:
    get:
      summary: Get trends
      tags: [Explore]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: Trending topics }

  /api/explore:
    get:
      summary: Explore content
      tags: [Explore]
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Explore feed }

  /api/communities:
    get:
      summary: Get communities
      tags: [Explore]
      responses:
        '200': { description: Communities }

  # ============ NOTIFICATIONS ============
  /api/notifications:
    get:
      summary: Get notifications
      description: Requires Bearer token. Use Authorize with accessToken from POST /api/auth/login.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Notifications }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/notifications/{id}/read:
    put:
      summary: Mark notification as read
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/notifications/read-all:
    put:
      summary: Mark all as read
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Updated }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  # ============ SPACES ============
  /api/spaces:
    get:
      summary: List spaces
      tags: [Spaces]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active spaces }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    post:
      summary: Create space
      description: Requires Bearer token. Use Authorize with accessToken from POST /api/auth/login.
      tags: [Spaces]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                scheduledAt: { type: string, format: date-time }
      responses:
        '201': { description: Space created }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/spaces/{id}/start:
    post:
      summary: Start space
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Spaces]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Space started }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/spaces/{id}/end:
    post:
      summary: End space
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Spaces]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Space ended }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  # ============ LISTS ============
  # All list endpoints require Bearer token. Use Authorize with accessToken from POST /api/auth/login.
  /api/lists/pinned:
    get:
      summary: Get pinned lists
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pinned lists }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/lists/discover:
    get:
      summary: Discover lists
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lists }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/lists/yours:
    get:
      summary: Your lists
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User lists }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/lists:
    post:
      summary: Create list
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                isPrivate: { type: boolean }
      responses:
        '201': { description: List created }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/lists/{id}/members:
    post:
      summary: Add member to list
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
      responses:
        '200': { description: Added }
        '401': { description: Unauthorized - use Authorize with accessToken from login }
    delete:
      summary: Remove member from list
      description: Requires Bearer token. Use Authorize with accessToken from login.
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  /api/lists/membership/{userId}:
    get:
      summary: Get list membership for user
      tags: [Lists]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Membership }
        '401': { description: Unauthorized - use Authorize with accessToken from login }

  # ============ ADS ============
  /api/ads/account:
    get:
      summary: Get ads account
      description: Requires Bearer token. Click **Authorize** (lock icon) and paste your accessToken from POST /api/auth/login, then try again.
      tags: [Ads]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ads account }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Update billing
      description: Requires Bearer token. Click **Authorize** and paste your accessToken from login.
      tags: [Ads]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                billingEmail: { type: string }
                paymentMethodId: { type: string }
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ads/campaigns:
    get:
      summary: List campaigns
      description: Requires Bearer token. Use **Authorize** with accessToken from login.
      tags: [Ads]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Campaigns }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create campaign
      description: Requires Bearer token. Use **Authorize** with accessToken from login.
      tags: [Ads]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                budget: { type: number }
                startDate: { type: string }
                endDate: { type: string }
      responses:
        '201': { description: Campaign created }
        '401': { $ref: '#/components/responses/Unauthorized' }

